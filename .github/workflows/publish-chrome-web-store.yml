name: Publish Chrome Web Store

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrome-web-store-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'vrnrn/youtube-player-for-twitch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Select the latest generated GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          releases_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          release_tag="$(jq -er '
            [ .[][]
              | select(.draft == false and .prerelease == false)
              | select(.tag_name | test("^v[0-9]+(\\.[0-9]+){3}$"))
              | select(any(.assets[]?; .name == "manifest.json") and any(.assets[]?; .name == "release.zip"))
              | .tag_name as $tag
              | ($tag | capture("^v(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)\\.(?<build>[0-9]+)$")) as $v
              | {tag: $tag, version: [($v.major | tonumber), ($v.minor | tonumber), ($v.patch | tonumber), ($v.build | tonumber)]}
            ]
            | sort_by(.version)
            | last
            | .tag // empty
          ' <<<"$releases_json")" || {
            echo "No generated four-part release with manifest.json and release.zip is available." >&2
            exit 1
          }

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Selected generated release $release_tag."

      - name: Check out the selected release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Download the selected release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern manifest.json \
            --pattern release.zip \
            --dir release-assets
          cp release-assets/manifest.json manifest.json
          cp release-assets/release.zip release.zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit selected release to Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: npm run publish
