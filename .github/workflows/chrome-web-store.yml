name: Build Chrome Extension

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release from this main build
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-and-build:
    name: Verify and build extension
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check syntax, tests, and website
        run: npm run check

      - name: Assign build version
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        id: version
        run: |
          node scripts/set-build-version.mjs
          version="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("manifest.json", "utf8")).version)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and validate release ZIP
        run: npm run build

      - name: Store build assets
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-build
          path: |
            manifest.json
            release.zip
          if-no-files-found: error
          retention-days: 1

  create-github-release:
    name: Create GitHub release
    needs: verify-and-build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          name: chrome-extension-build
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify-and-build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"

          if ! gh release view "$tag" --json tagName >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "Verified extension build from main commit $GITHUB_SHA."
          fi

          gh release upload "$tag" \
            release-assets/manifest.json \
            release-assets/release.zip \
            --clobber
