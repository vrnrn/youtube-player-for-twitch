<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Product social image</title
  ><style>
    @font-face {
      font-family: Manrope;
      src: url("../../site/assets/manrope-latin.woff2") format("woff2");
      font-weight: 400 800;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0b0b10;
      color: #f1f0f5;
      font-family: Manrope, Arial, sans-serif;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
      position: absolute;
      left: 54px;
      top: 45px;
      font-size: 20px;
      font-weight: 750;
    }
    .brand img {
      width: 43px;
      height: 43px;
    }
    .brand span span {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #b3a6c4;
    }
    h1 {
      position: absolute;
      left: 54px;
      top: 164px;
      margin: 0;
      font-size: 58px;
      line-height: 1.15;
      letter-spacing: -2.6px;
      font-weight: 800;
    }
    h1 span {
      color: #b99aff;
    }
    p {
      position: absolute;
      left: 57px;
      top: 388px;
      color: #b5a9c4;
      font-size: 19px;
    }
    .facts {
      position: absolute;
      left: 57px;
      bottom: 62px;
      color: #b99aff;
      font-size: 15px;
      letter-spacing: 0.2px;
    }
    .art {
      position: absolute;
      left: 699px;
      top: 142px;
      width: 446px;
      height: 377px;
      border: 1px solid #675079;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 100px #7548ae20;
    }
    .bar {
      height: 38px;
      background: #201c28;
      padding: 10px 17px;
      color: #c4abd9;
      font-size: 11px;
      font-weight: 650;
    }
    .art img {
      display: block;
      width: 100%;
      height: calc(100% - 38px);
      object-fit: cover;
    }
    .chat {
      position: absolute;
      right: 20px;
      bottom: 21px;
      background: #18121ded;
      border: 1px solid #b799d344;
      padding: 14px 17px;
      border-radius: 7px;
      color: #e8dfef;
      font-size: 11px;
      line-height: 2;
    }
    .chat b {
      color: #b99aff;
    }
    .site {
      position: absolute;
      left: 57px;
      bottom: 25px;
      font-size: 10px;
      color: #8e819c;
    }
  </style>
  <body>
    <div class="brand">
      <img src="../../site/assets/mark.svg" alt="" /><span
        >YouTube Player<span>for Twitch</span></span
      >
    </div>
    <h1>
      Your video on<br />YouTube.<br /><span>Your people on Twitch.</span>
    </h1>
    <p>Your stream. Your community. One tab.</p>
    <div class="facts">Free Chrome extension · Open source</div>
    <div class="art">
      <div class="bar">YOUTUBE VIDEO. TWITCH CHAT.</div>
      <img src="../../site/assets/adventure-stream.jpg" alt="" />
      <div class="chat">
        <b>TWITCH CHAT</b><br /><b>pixelpilot</b> this view is unreal<br /><b
          >mossy</b
        >
        we made it 🌿<br /><b>lunar</b> chat never left 💜
      </div>
    </div>
    <div class="site">youtube-player-for-twitch.vrnrn.com</div>
  </body>
</html>
